# 说明： ①使用前需补充完整 “订阅链接” 与 “机场名”，可将 “nameserver” 修改为运营商提供的 DNS 地址; ②已隐藏“区域-故转”、“区域-自动”这两个策略组，使用时按需手动选取对应地区策略组即可。



# ███████████████████████████ 锚点区域 ███████████████████████████
# ══ 订阅锚点 ══
Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$"}

# ══ 出站锚点 ══
Anchor_DP: &Anchor_DP {type: select, proxies: [直连, 香港-故转, 台湾-故转, 日本-故转, 新加坡-故转, 韩国-故转, 美国-故转, 欧洲-故转, 香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 韩国-自动, 美国-自动, 欧洲-自动, 香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动, 其他-手动, 拒绝]}

# ══ 策略锚点 ══
Anchor_HS: &Anchor_HS {type: select, empty-fallback: REJECT, include-all: true}
Anchor_FB: &Anchor_FB {type: fallback, empty-fallback: REJECT, interval: 180, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204'}
Anchor_UT: &Anchor_UT {type: url-test, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50, include-all: true}

# ══ 规则锚点 ══
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Anchor_CL: &Anchor_CL {type: http, interval: 86400, behavior: classical, format: text}

# ══ 区域锚点 ══
Anchor_HK: &Anchor_HK '(?i)^(?=.*(香港|(?<![a-zA-Z])(hk|hkg)(?![a-zA-Z])|hongkong|hong kong|🇭🇰)).*$'
Anchor_TW: &Anchor_TW '(?i)^(?=.*(台湾|(?<![a-zA-Z])(tw|tpe|khh|tsa)(?![a-zA-Z])|taiwan|taipei|🇹🇼)).*$'
Anchor_JP: &Anchor_JP '(?i)^(?=.*(日本|(?<![a-zA-Z])(jp|nrt|hnd|kix|cts|fuk)(?![a-zA-Z])|japan|tokyo|🇯🇵)).*$'
Anchor_SG: &Anchor_SG '(?i)^(?=.*(新加坡|(?<![a-zA-Z])(sg|sin|xsp)(?![a-zA-Z])|singapore|🇸🇬)).*$'
Anchor_KR: &Anchor_KR '(?i)^(?=.*(韩国|(?<![a-zA-Z])(kr|icn|gmp|pus)(?![a-zA-Z])|korea|seoul|🇰🇷)).*$'
Anchor_US: &Anchor_US '(?i)^(?=.*(美国|(?<![a-zA-Z])(us|usa|lax|sfo|jfk|sjc)(?![a-zA-Z])|america|united states|🇺🇸)).*$'
Anchor_EU: &Anchor_EU '(?i)^(?=.*(奥地利|奥地利共和国|比利时|保加利亚|克罗地亚|塞浦路斯|捷克|丹麦|爱沙尼亚|芬兰|法国|德国|希腊|匈牙利|爱尔兰|意大利|拉脱维亚|立陶宛|卢森堡|荷兰|波兰|葡萄牙|罗马尼亚|斯洛伐克|斯洛文尼亚|西班牙|瑞典|英国|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU)).*$'
Anchor_OT: &Anchor_OT '^(?!.*(直连|拒绝|香港|台湾|日本|新加坡|韩国|美国|奥地利|奥地利共和国|比利时|保加利亚|克罗地亚|塞浦路斯|捷克|丹麦|爱沙尼亚|芬兰|法国|德国|希腊|匈牙利|爱尔兰|意大利|拉脱维亚|立陶宛|卢森堡|荷兰|波兰|葡萄牙|罗马尼亚|斯洛伐克|斯洛文尼亚|西班牙|瑞典|英国|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW)).*$'




# ███████████████████████████ 节点订阅 ███████████████████████████
# 将 “订阅链接” 与 “机场名” 替换为所用机场信息； 订阅条数不够可新增，注意开头缩进，不同条数前方 “机场名” 不能重复； 末尾的 “机场名” 作用为每个节点添加机场名称前缀，可自定义。
proxy-providers:
#  机场名: {<<: *Anchor_PR, url: '订阅链接', override: {additional-prefix: '[机场名] '}}




# ███████████████████████████ 核心配置 ███████████████████████████
# ══ 基础配置 ══
mode: rule                                                              # 工作模式  rule（规则模式）/ global（全局模式）/ direct（直连模式）
mixed-port: 7890                                                        # 监听端口  HTTP + SOCKS5 混合代理端口（GPT修改默认端口7893）
allow-lan: true                                                         # 局域连接  是否允许局域网设备连接
bind-address: "*"                                                       # 监听接口  监听的网络接口（* 表示所有接口）
ipv6: false                                                             # 网络协议  是否启用 IPv6 支持
log-level: warning                                                      # 日志级别  silent（静默）/ error（错误）/ warning（警告）/ info（信息）/ debug（调试）
unified-delay: true                                                     # 统一延迟  减少节点延迟抖动
tcp-concurrent: true                                                    # 并发连接  提升多任务性能
global-ua: clash.meta                                                  # 用户代理  全局默认UA
keep-alive-idle: 600                                                    # TCP Keep-Alive 空闲时间（GPT新增）
keep-alive-interval: 15                                                 # TCP Keep-Alive 探测间隔（GPT新增）
profile: { store-selected: true, store-fake-ip: true }                  # 保存选择  记住选择的节点和策略组、Fake-IP 映射
proxies:                                                                # 定义函数
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ══ 管理面板 ══
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
#external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
external-controller: 0.0.0.0:9090                                       # 面板地址
external-ui-name: zashboard                                             # 面板名称
external-ui: ui                                                         # 面板目录
secret: ""                                                              # 面板密码

# ══ TUN配置 ══
tun:
  enable: true                                                          # 网卡模式  是否启用 TUN 虚拟网卡模式  
  stack: mixed                                                          # 协议类型  网络栈：system（系统栈）/ gvisor（内置用户态栈）/ mixed（混合）
  dns-hijack: [udp://any:53, tcp://any:53]                              # 劫持请求  劫持所有 UDP/TCP 53 端口的 DNS 请求
  auto-detect-interface: true                                           # 自动出口  自动识别默认出口网络接口 （仅内核模式有效）
  auto-route: true                                                      # 自动路由  自动添加系统路由表      （仅内核模式有效）
  auto-redirect: true                                                   # 自动定向  自动将流量重定向至 TUN  （仅内核模式有效）
  strict-route: false                                                   # 路由模式  严格路由模式
  endpoint-independent-nat: true                                        # 端点无关  NAT（提高 NAT 类型兼容性，适用于 P2P 和游戏）（GPT建议false）
  route-exclude-address-set: [cn_ip]                                    # 绕过大陆  匹配大陆IP-CIDR（流量不进入代理） 

# ══ 嗅探功能 ══
sniffer:
  enable: true                                                          # 启用嗅探  提升分流准确性
  override-destination: true                                            # 成功解析  使用嗅探到的域名覆盖原始目标地址
  parse-pure-ip: true                                                   # 反向解析  解析纯 IP 连接（尝试反向解析获得域名）（GPT建议false）
  force-dns-mapping: true                                               # 强制映射  DNS 映射（对纯 IP 连接尝试 DNS 映射）（GPT建议false）
  sniff:
    QUIC: { ports: [443] }                                              # 嗅探参数  QUIC 协议流量（HTTP/3 常用端口）
    TLS:  { ports: [443, 8443] }                                        # 嗅探参数  HTTPS（TLS）常用及备用端口
    HTTP: { ports: [80, 8080-8880] }                                    # 嗅探参数  HTTP 及常见 Web / 代理端口段
  force-domain:
    - "+.netflix.com"                                                   # 强制嗅探  Netflix 主域名
    - "+.nflxvideo.net"                                                 # 强制嗅探  Netflix CDN
    - "+.amazonaws.com"                                                 # 强制嗅探  AWS 云服务
    - "+.media.dssott.com"                                              # 强制嗅探  Disney+ 流媒体
    - "+.tiktok.com"                                                    # 强制嗅探  TikTok 流媒体
  skip-domain:
    - Mijia Cloud                                                       # 跳过嗅探  米家云服务
    - dlg.io.mi.com                                                     # 跳过嗅探  小米设备通信
    - "+.oray.com"                                                      # 跳过嗅探  花生壳服务
    - "+.sunlogin.net"                                                  # 跳过嗅探  向日葵远程控制
    - "+.push.apple.com"                                                # 跳过嗅探  苹果推送服务

# ══ hosts配置 ══
hosts:
  'services.googleapis.cn': ['services.googleapis.com']                 # 谷歌商店  解决无法下载的问题

# ══ DNS配置 ══
dns:
  enable: true                                                          # 解析服务  启用 Clash 内置 DNS 服务
  cache-algorithm: arc
  listen: 0.0.0.0:7874                                                  # 监听服务  DNS 服务监听地址与端口
  ipv6: false                                                           # 网络协议  启用 IPv6 DNS 解析支持
  enhanced-mode: fake-ip                                                # 增强模式  FDNS 增强模式（Fake-IP，用于防止 DNS 泄露）
  fake-ip-range: 198.18.0.1/16                                          # 虚拟地址  Fake-IP 虚拟地址池范围
  fake-ip-filter-mode: blacklist                                        # 过滤模式  Fake-IP 过滤模式（命中规则则返回真实 IP）
  respect-rules: false                                                  # 遵循规则  不强制遵循规则顺序

  default-nameserver:
    - https://223.5.5.5/dns-query

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query

  fake-ip-filter:
    - "+.lan"
    - "+.local"
#    - "rule-set:Fakeipfilter_domain"
    - "rule-set:Add_direct_domain"                                      # 真实解析  大陆冷门域名
    - "rule-set:Cn_domain"                                              # 真实解析  大陆域名数据



